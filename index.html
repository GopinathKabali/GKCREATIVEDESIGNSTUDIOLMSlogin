const courses=[
{id:'foundation',title:'Design foundations',category:'Graphic design',level:'Beginner',time:'35 min',description:'Train your eye. Learn the principles behind thoughtful visual design.',art:'<div class="bigtype">Aa.</div>',lessons:[
['Start with visual hierarchy','Every composition gives the eye a route. Scale, contrast, position, and spacing tell people what to read first. Start with one clear focal point, then make supporting information quieter. A successful poster should communicate its main message even when seen as a small thumbnail.','Create an event poster using only three text sizes. Make the event name the focal point, then add the date and location. Shrink the page to 25% and check what you notice first.'],
['Balance and alignment','Balance distributes visual weight. A large dark shape can balance several small light shapes. Symmetry feels stable; asymmetry can create movement. Use a shared alignment edge to connect separate elements and avoid placing objects arbitrarily.','Build two versions of your poster: one symmetrical and one asymmetrical. Align every text block to a deliberate grid line. Compare the mood of each version.'],
['Contrast and colour','Contrast makes differences visible. Pair light and dark values before choosing hues. Use one dominant colour, one supporting colour, and an accent for important actions. Do not rely on colour alone to communicate information; add labels or shapes.','Make a three-colour palette and apply it to your poster. View it in greyscale and check that the heading and details are still readable.'],
['Your first composition','A strong composition combines hierarchy, balance, contrast, and space. Remove decorative elements that compete with the message. Review at full size and thumbnail size. Ask a viewer to describe the main message after five seconds.','Export your poster and write a short rationale describing your hierarchy, alignment, and colour choices. Revise one element after asking someone for feedback.']]},
{id:'brand',title:'Build a memorable brand',category:'Brand identity',level:'Beginner',time:'40 min',description:'Turn a clear idea into a visual identity with character and consistency.',art:'<div class="shapes"><i></i><i></i><i></i></div>',lessons:[
['Define the brand','A visual identity starts with a purpose and audience. Describe who the brand serves, what it helps them do, and how it should feel. Choose three specific personality words to guide visual decisions.','Invent a local café. Write its purpose, audience, and three personality words. Avoid vague words such as nice or modern.'],
['Explore a logo direction','Sketch broadly before polishing. Explore wordmarks, symbols, and letterforms. A useful logo works at small sizes and in one colour. Judge each idea against the brand brief rather than personal taste alone.','Sketch six black-and-white logo ideas for the café. Pick two and test them at 24 pixels and on a large sign.'],
['Build the visual system','An identity includes type, colour, spacing, imagery, and composition. Define repeatable rules so different materials feel related. Choose a readable body typeface and a clear hierarchy for headings.','Choose a type pairing and three colours. Design a menu header and a takeaway label using the same rules.'],
['Create a brand board','A brand board summarises the identity for other people to use. Include logo variants, colours, typography, image direction, and examples. Add usage notes so decisions can be repeated.','Create a single-page brand board for your café and explain how each choice supports its personality.']]},
{id:'ui',title:'UI design essentials',category:'UI / UX',level:'Beginner',time:'45 min',description:'Design clear, useful interfaces, one intentional screen at a time.',art:'<div class="ui-art"><i></i><i></i><i></i><i></i></div>',lessons:[
['Understand the task','Good interfaces help people complete a task. Define the user, their goal, and the main action on a screen. Map the shortest useful path before adding visual polish.','Choose a course-booking task. Write the steps from choosing a class to confirming a booking. Identify the primary action on each screen.'],
['Layout and spacing','Use a consistent spacing scale such as 4, 8, 16, 24, and 32 pixels. Group related controls and separate unrelated sections. Design for a narrow screen first to reveal priorities.','Draw a mobile course-detail screen. Include a title, summary, lesson list, and enrolment action using a consistent spacing scale.'],
['Components and states','Buttons, inputs, and cards need consistent rules. Design default, focus, disabled, loading, and error states where applicable. Give controls visible labels and feedback after an action.','Create a button and an email input with their focus and error states. Explain the error in text and show how to recover.'],
['Test and refine','Ask a person to complete the task without explaining the interface. Observe where they hesitate. Check keyboard navigation, clear labels, readable text, and layout at different sizes.','Test your course-booking flow with one person. Record three observations and revise the part that caused the most hesitation.']]},
{id:'type',title:'Typography in practice',category:'Typography',level:'Intermediate',time:'30 min',description:'Find your type. Shape rhythm, readability, and expressive layouts.',art:'<div class="bigtype">Type</div>',lessons:[
['Choose type with purpose','Type communicates tone as well as words. Compare letter shapes, proportions, and spacing. Start with one versatile family and create hierarchy using weight and size before adding another family.','Set the same headline in three typefaces. Describe how each changes the tone, then select one for a cultural magazine.'],
['Create reading rhythm','Line length, leading, and paragraph spacing influence readability. Avoid lines that feel cramped or excessively long. Use consistent paragraph styles and check real content at the intended reading size.','Set a 200-word article with two different line widths. Adjust line height and compare how comfortably each version reads.'],
['Build a type specimen','A specimen demonstrates a typeface in use. Include large display text, body copy, numbers, and punctuation. Use hierarchy and whitespace to make the page useful and expressive.','Design a one-page specimen for your selected family. Include a headline, a short paragraph, a quotation, and numerals.']]}
];

const app=document.querySelector('#app'),modal=document.querySelector('#modal');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const done=c=>c.lessons.filter((_,i)=>state[c.id]?.includes(i)).length;const pct=c=>Math.round(done(c)/c.lessons.length*100);function save(){try{localStorage.setItem('gk-learning-v1',JSON.stringify(state))}catch{document.querySelector('#modalBody').insertAdjacentHTML('beforeend','<p>Browser storage is unavailable. Your progress will last for this session only.</p>')}}

function openCourse(id){current=courses.find(c=>c.id===id);if(!current)return;if(!Array.isArray(state[id])){state[id]=[];save()}index=current.lessons.findIndex((_,i)=>!state[id].includes(i));if(index<0)index=0;lesson();if(!modal.open)modal.showModal();render()}
function lesson(){const c=current,l=c.lessons[index];document.querySelector('#modalTitle').textContent=c.title;document.querySelector('#modalBody').innerHTML='<div class="lesson-layout"><div class="lesson-nav">'+c.lessons.map((l,i)=>'<button class="'+(i===index?'current':'')+'" data-lesson="'+i+'">'+(state[c.id]?.includes(i)?'✓ ':'')+(i+1)+'. '+l[0]+'</button>').join('')+'</div><section class="lesson"><div class="eyebrow">LESSON '+(index+1)+' OF '+c.lessons.length+'</div><h2>'+l[0]+'</h2><p>'+l[1]+'</p><div class="exercise"><b>Put it into practice</b><br>'+l[2]+'</div><button class="primary" id="complete">'+(state[c.id]?.includes(index)?'Completed ✓ · Continue':'Mark complete & continue →')+'</button><p class="notice">Complete the exercise before marking this lesson done.</p></section></div>'}
const resources=['GK CREATIVE DESIGN STUDIO — PROJECT BRIEF\n\nProject name:\nAudience:\nProblem to solve:\nPrimary message:\nDeliverables:\nConstraints:\nThree personality words:\nReferences:\nSuccess criteria:\nReview notes:','GK CREATIVE DESIGN STUDIO — DESIGN REVIEW\n\n[ ] One clear focal point\n[ ] Consistent alignment\n[ ] Readable type\n[ ] Useful contrast\n[ ] Intentional spacing\n[ ] Consistent colours\n[ ] Clear labels\n[ ] Test at small and large sizes\n[ ] Get feedback\n\nOne thing to improve:','GK CREATIVE DESIGN STUDIO — WEEKLY PRACTICE\n\nThis week I want to learn:\n\nMonday — Observe a design:\nTuesday — Sketch an idea:\nWednesday — Explore a variation:\nThursday — Refine the details:\nFriday — Ask for feedback:\nWeekend — Reflect:\n\nWhat worked?\nWhat will I try next?'];
function challenge(){document.querySelector('#modalTitle').textContent='Your 20-minute typography challenge';document.querySelector('#modalBody').innerHTML='<div class="eyebrow">OBSERVE. EXPERIMENT. REFINE.</div><h2>One word. Three different moods.</h2><p>Choose a word such as “hello”, “bloom”, or “create”. Set it three times to express calm, energy, and elegance.</p><ol><li>Spend 3 minutes sketching possible letter styles.</li><li>Spend 12 minutes making three compositions. Change type, scale, spacing, and colour.</li><li>Spend 5 minutes comparing them. Ask someone to name the mood of each.</li></ol><div class="exercise">Reflection: Which single design choice changed the mood most? Write two sentences about what you discovered.</div>';if(!modal.open)modal.showModal()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view||b.dataset.goto){view=b.dataset.view||b.dataset.goto;filter='All courses';query='';document.querySelector('#search').value='';render()}if(b.dataset.filter){filter=b.dataset.filter;render()}if(b.dataset.course)openCourse(b.dataset.course);if(b.dataset.lesson!==undefined){index=Number(b.dataset.lesson);lesson()}if(b.id==='complete'){if(!state[current.id].includes(index))state[current.id].push(index);save();if(index<current.lessons.length-1){index++;lesson()}else{document.querySelector('#modalBody').innerHTML='<div class="eyebrow">COURSE COMPLETE</div><h2>You made room for growth. ✧</h2><p>You completed '+esc(current.title)+'. Review your project, collect feedback, and keep experimenting.</p><button class="primary" id="finish">Back to your studio →</button>'}render()}if(b.classList.contains('close')||b.id==='finish')modal.close();if(['challenge','challengeSide'].includes(b.id))challenge()});document.querySelector('#search').addEventListener('input',e=>{query=e.target.value;if(!['catalog','dashboard','learning'].includes(view))view='catalog';render()});render();
